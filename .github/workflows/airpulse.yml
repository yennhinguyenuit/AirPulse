name: AirPulse Google Flights Collector

on:
  workflow_dispatch:

  schedule:
    - cron: "28 2,5,8,11,14,17,20,23 * * *"
      timezone: "Asia/Ho_Chi_Minh"

permissions:
  contents: write

concurrency:
  group: airpulse-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AirPulse collector
        env:
          SERPAPI_KEY_A: ${{ secrets.SERPAPI_KEY_A }}
          SERPAPI_KEY_B: ${{ secrets.SERPAPI_KEY_B }}
          SERPAPI_KEY_C: ${{ secrets.SERPAPI_KEY_C }}
        run: python collect_google_flights.py

      - name: Save collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/airpulse_google_flights.db
          git add data/processed/google_flights.csv
          git add data/processed/google_fare_observations.csv

          git diff --cached --quiet && echo "No data changes" && exit 0

          git commit -m "Update AirPulse fare observations"
          git push
